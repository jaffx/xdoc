<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xdoc</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f7cff'/%3E%3Cpath d='M9 10h5.5L16 22l1.5-12H23' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__head">
        <div class="brand">
          <span class="brand__logo" aria-hidden="true">
            <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8"/><path d="M9 10h5.5L16 22l1.5-12H23" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="brand__name">xdoc</span>
        </div>
        <button class="icon-btn" id="theme-toggle" title="切换主题" aria-label="切换主题">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
      <div class="space-switch" id="space-switch">
        <button class="space-btn" id="space-btn" aria-haspopup="true" aria-expanded="false">
          <svg class="space-btn__folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
          <span class="space-btn__name" id="space-btn-name">加载中…</span>
          <svg class="space-btn__caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="space-menu" id="space-menu" hidden>
          <div class="space-menu__list" id="space-list"></div>

          <form class="space-form" id="space-edit" hidden>
            <div class="space-form__title">编辑空间信息</div>
            <label>名称
              <input id="space-edit-name" type="text" autocomplete="off" spellcheck="false" placeholder="空间名称">
            </label>
            <label>备注
              <textarea id="space-edit-desc" rows="2" placeholder="例如：产品需求文档、团队周报…"></textarea>
            </label>
            <div class="space-form__actions">
              <button type="button" class="ghost" id="space-edit-cancel">取消</button>
              <button type="submit" id="space-edit-save">保存</button>
            </div>
          </form>

          <form class="space-form" id="space-create" hidden>
            <div class="space-form__title">新建空间</div>
            <label>位置
              <input id="space-create-parent" type="text" autocomplete="off" spellcheck="false" placeholder="父目录，支持 ~">
            </label>
            <label>名称
              <input id="space-create-name" type="text" autocomplete="off" spellcheck="false" placeholder="文件夹名称">
            </label>
            <label>备注
              <textarea id="space-create-desc" rows="2" placeholder="可选"></textarea>
            </label>
            <div class="space-form__actions">
              <button type="button" class="ghost" id="space-create-cancel">取消</button>
              <button type="submit" id="space-create-submit">创建</button>
            </div>
          </form>

          <div class="space-menu__add">
            <input id="space-path" type="text" placeholder="输入已有目录路径，添加空间…" autocomplete="off" spellcheck="false">
            <button id="space-add" type="button" title="添加已有目录" aria-label="添加已有目录">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button id="space-create-toggle" class="is-secondary" type="button" title="新建空间" aria-label="新建空间">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M12 11v6M9 14h6"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="sidebar__search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input id="search" type="text" placeholder="搜索文档…" autocomplete="off">
      </div>
      <div class="tree-toolbar">
        <span class="tree-toolbar__label">文档</span>
        <button class="icon-btn tree-toolbar__btn" id="new-file" type="button" title="新建文件" aria-label="新建文件">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 12v6M9 15h6"/></svg>
        </button>
        <button class="icon-btn tree-toolbar__btn" id="new-folder" type="button" title="新建文件夹" aria-label="新建文件夹">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M12 11v6M9 14h6"/></svg>
        </button>
      </div>
      <nav class="tree" id="tree" aria-label="文档目录"></nav>
      <div class="sidebar__foot">
        <span class="sidebar__root" id="space-root"></span>
        <span id="embed-count"></span>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-toggle" title="目录" aria-label="切换目录">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="crumb" id="crumb">首页</div>
        <div class="status" id="status" role="status"></div>
      </header>
      <div class="content-wrap" id="scroller">
        <article class="content markdown-body" id="content">
          <div class="empty">
            <h1>欢迎使用 xdoc</h1>
            <p>从左侧选择一个 markdown 文件开始阅读。</p>
          </div>
        </article>
        <nav class="toc is-hidden" id="toc" aria-label="本文目录"></nav>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <style id="custom-styles"></style>
  <script src="/app.js" defer></script>
</body>
</html>
